# Single-asset case study: SPY since 1993 (the setting of the original notebook).
# A long sample that contains three full equity bear markets (2000-02, 2007-09,
# 2022) plus the 2020 crash, but no diversification across assets.

name: spy_case_study
title: SPY single-asset case study
description: >
  Trend following and regime filtering on one equity index over 30 years.

universe:
  SPY: {name: US large caps, group: Equities}

data:
  start: "1993-01-01"
  end: "2026-11-01"
  risk_free: {ticker: "^IRX"}

signals:
  tsmom_lookback: 252
  donchian_entry: 55
  donchian_exit: 20
  kalman_trend_period: 126
  kalman_full_position_sharpe: 0.5

regime:
  hmm:
    n_states: 2
    features: [return]
    train_days: 2520
    min_train_days: 756
    refit_every: 21
    n_iter: 200
    n_init: 5
    seed: 7
  vol_control:
    window: 21
    median_window: 756

portfolio:
  asset_vol_halflife: 30
  portfolio_vol_target: 0.10
  portfolio_vol_halflife: 60
  max_gross_leverage: 2.0
  transaction_cost_bps: 2        # SPY is the most liquid ETF in the world
  rebalance_buffer: 0.25
  min_history_days: 756

evaluation:
  start: "1996-03-01"
  cost_sensitivity_bps: [0, 1, 2, 5, 10]
  bootstrap_samples: 2000
  bootstrap_block: 21
  seed: 7
  anatomy_asset: SPY
  anatomy_window: ["2007-06-01", "2009-12-31"]
  crises:
    Dot-com bust:            ["2000-03-24", "2002-10-09"]
    Global financial crisis: ["2007-10-09", "2009-03-09"]
    Euro debt crisis:        ["2011-07-22", "2011-10-03"]
    Q4 2018 sell-off:        ["2018-09-20", "2018-12-24"]
    COVID crash:             ["2020-02-19", "2020-03-23"]
    2022 inflation shock:    ["2022-01-03", "2022-10-12"]
