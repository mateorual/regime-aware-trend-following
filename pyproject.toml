[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regime-trend"
version = "0.1.0"
description = "Do hidden-Markov regime filters improve trend following? A walk-forward study with a Kalman trend model, Donchian breakouts and time-series momentum."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "hmmlearn>=0.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "pyarrow>=12.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
regime-trend = "regime_trend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["E501"]
